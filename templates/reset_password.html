{% extends 'public_base.html' %}
{% block title %}Choose a New Password · Solara Creator Suite{% endblock %}
{% block content %}
<section class="public-auth">
    <p class="public-kicker">Account recovery</p>
    <h1>Choose a new password</h1>
    <form method="post" class="form">
        <label>New password<input type="password" name="password" minlength="10" autocomplete="new-password" required></label>
        <label>Confirm password<input type="password" name="password_confirm" minlength="10" autocomplete="new-password" required></label>
        <button class="button" type="submit">Update password</button>
    </form>
</section>
{% endblock %}
