{% extends 'public_base.html' %}
{% block title %}Reset Password · Business Tracker{% endblock %}
{% block content %}
<section class="public-auth">
    <p class="public-kicker">Account recovery</p>
    <h1>Forgot your password?</h1>
    <p class="muted">Enter the email on your account and we will send a time-limited reset link.</p>
    <form method="post" class="form">
        <label>Email<input type="email" name="email" autocomplete="email" required></label>
        <button class="button" type="submit">Send reset link</button>
    </form>
    <p class="public-auth-note"><a href="{{url_for('login')}}">Return to sign in</a></p>
</section>
{% endblock %}
