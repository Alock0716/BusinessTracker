<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Business Tracker{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body><aside><div class="brand">Business Tracker</div><nav><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('products')}}">Products</a><a href="{{url_for('sales')}}">Sales</a><a href="{{url_for('customers')}}">Customers</a><a href="{{url_for('analytics')}}">Analytics</a><a href="{{url_for('settings')}}">Settings</a></nav><a class="logout-link" href="{{ url_for('logout') }}">Sign out</a></aside><main><header><h1>{% block heading %}{% endblock %}</h1></header>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{url_for('static',filename='js/app.js')}}"></script></body></html>
